<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mannunty 💜</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #1a0833;
    --deep: #2a0f52;
    --violet: #7c3aed;
    --orchid: #c026d3;
    --pink: #ff4fa3;
    --blush: #ffd1ea;
    --glass: rgba(255, 255, 255, 0.10);
    --glass-edge: rgba(255, 255, 255, 0.28);
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); height: 100%; }
  *, *::before, *::after { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100%;
    background: var(--ink);
    color: #fff;
    font-family: "Quicksand", "Segoe UI", system-ui, sans-serif;
    overflow-x: hidden;
    -webkit-text-size-adjust: 100%;
    -webkit-tap-highlight-color: transparent;
  }
  button, input, textarea { touch-action: manipulation; }

  /* ---------- living background ---------- */
  .bg { position: fixed; inset: 0; z-index: 0; overflow: hidden;
    background:
      radial-gradient(1200px 800px at 15% 10%, #5b21b6 0%, transparent 60%),
      radial-gradient(1000px 700px at 90% 90%, #be185d 0%, transparent 60%),
      linear-gradient(160deg, #1a0833, #3b0f6b 45%, #6d1458 100%);
  }
  .orb { position: absolute; border-radius: 50%; opacity: .5; will-change: transform; animation: drift 18s ease-in-out infinite alternate; }
  .orb.o1 { width: 46vmax; height: 46vmax; background: radial-gradient(circle, #8b5cf6 0%, transparent 66%); left: -12vmax; top: -10vmax; }
  .orb.o2 { width: 40vmax; height: 40vmax; background: radial-gradient(circle, #ff4fa3 0%, transparent 66%); right: -10vmax; bottom: -12vmax; animation-duration: 22s; }
  .orb.o3 { width: 28vmax; height: 28vmax; background: radial-gradient(circle, #c026d3 0%, transparent 66%); left: 40%; top: 35%; opacity: .35; animation-duration: 26s; }
  @keyframes drift { to { transform: translate3d(8vmax, 6vmax, 0) scale(1.15); } }
  .grain { position: absolute; inset: 0; opacity: .08;
    background-image: radial-gradient(#fff 1px, transparent 1px); background-size: 3px 3px; }
  #hearts { position: fixed; inset: 0; z-index: 1; pointer-events: none; width: 100%; height: 100%; }

  .stage { position: relative; z-index: 2; min-height: 100vh; min-height: 100dvh; display: grid; place-items: center; padding: 28px 18px; }

  /* ---------- glass card ---------- */
  .card {
    width: min(92vw, 520px);
    background: var(--glass);
    border: 1px solid var(--glass-edge);
    border-radius: 32px;
    padding: 42px 30px 34px;
    backdrop-filter: blur(22px) saturate(140%);
    -webkit-backdrop-filter: blur(22px) saturate(140%);
    box-shadow: 0 30px 80px rgba(20, 0, 50, .55), inset 0 1px 0 rgba(255,255,255,.35), 0 0 60px rgba(255, 79, 163, .18);
    text-align: center; position: relative;
    transition: transform .2s ease-out;
  }
  .card::before { content: ""; position: absolute; inset: -2px; border-radius: 34px; z-index: -1;
    background: conic-gradient(from 0deg, #ff4fa3, #8b5cf6, #c026d3, #ff4fa3);
    filter: blur(22px); opacity: .45; }
  @keyframes spin { to { transform: rotate(360deg); } }

  .lock-heart { font-size: 64px; display: inline-block; animation: beat 1.4s ease-in-out infinite; filter: drop-shadow(0 0 22px rgba(255,79,163,.9)); }
  @keyframes beat { 0%,100% { transform: scale(1);} 14% { transform: scale(1.18);} 28% { transform: scale(1);} 42% { transform: scale(1.12);} 70% { transform: scale(1);} }

  h2.gate-title { font-family: "Great Vibes", cursive; font-weight: 400; font-size: 46px; margin: 10px 0 4px; letter-spacing: .5px;
    background: linear-gradient(90deg, #ffd1ea, #fff, #e9d5ff); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .sub { margin: 0 0 24px; color: #f3dcff; opacity: .85; font-size: 15px; }

  .pin { display: flex; gap: 12px; justify-content: center; margin-bottom: 18px; }
  .pin input {
    width: 58px; height: 68px; text-align: center; font-size: 30px; font-weight: 700; color: #fff;
    background: rgba(255,255,255,.12); border: 1.5px solid rgba(255,255,255,.3); border-radius: 18px; outline: none;
    font-family: inherit; transition: .2s; caret-color: var(--pink);
  }
  .pin input:focus { border-color: var(--pink); box-shadow: 0 0 0 4px rgba(255,79,163,.28), 0 0 24px rgba(255,79,163,.5); transform: translateY(-2px); }
  .pin.shake { animation: shake .5s; }
  @keyframes shake { 20%{transform:translateX(-12px)} 40%{transform:translateX(10px)} 60%{transform:translateX(-8px)} 80%{transform:translateX(6px)} }

  .msg-err { min-height: 26px; color: #ffb3d9; font-weight: 700; font-size: 17px; margin: 0 0 14px; transition: opacity .3s; }

  .btn {
    appearance: none; border: 0; cursor: pointer; font-family: inherit; font-weight: 700; font-size: 17px; color: #fff;
    padding: 15px 34px; border-radius: 999px; position: relative; overflow: hidden;
    background: linear-gradient(120deg, #8b5cf6, #c026d3 50%, #ff4fa3);
    box-shadow: 0 12px 30px rgba(192, 38, 211, .45), inset 0 1px 0 rgba(255,255,255,.4);
    transition: transform .2s, box-shadow .2s;
  }
  .btn:hover { transform: translateY(-3px) scale(1.03); box-shadow: 0 18px 40px rgba(255,79,163,.55); }
  .btn:active { transform: scale(.97); }
  .btn::after { content: ""; position: absolute; top: 0; left: -80%; width: 50%; height: 100%;
    background: linear-gradient(100deg, transparent, rgba(255,255,255,.55), transparent); transform: skewX(-20deg); animation: sheen 3.2s 3; }
  @keyframes sheen { 60%,100% { left: 140%; } }
  .btn.ghost { background: rgba(255,255,255,.12); box-shadow: inset 0 0 0 1.5px rgba(255,255,255,.35); }
  :focus-visible { outline: 3px solid #fff; outline-offset: 3px; }

  /* ---------- main reveal ---------- */
  #main { display: none; width: 100%; max-width: 640px; margin: 0 auto; }
  .hero { text-align: center; padding: 14px 0 30px; }
  .hero h1 { font-family: "Great Vibes", cursive; font-weight: 400; font-size: clamp(64px, 18vw, 120px); margin: 0; line-height: 1.05;
    background: linear-gradient(100deg, #fff 0%, #ffd1ea 30%, #f0abfc 55%, #a78bfa 80%, #fff 100%); background-size: 200% auto;
    -webkit-background-clip: text; background-clip: text; color: transparent; animation: shine 5s linear 3;
    filter: drop-shadow(0 6px 30px rgba(255,79,163,.55)); }
  @keyframes shine { to { background-position: 200% center; } }
  .hero h1 .ph { display: inline-block; -webkit-text-fill-color: initial; color: initial; animation: beat 1.6s ease-in-out infinite; font-size: .7em; vertical-align: middle; margin-left: 6px; }
  .hero p { margin: 8px 0 0; font-size: 18px; letter-spacing: .5px; color: #fbe7ff; }

  .letter { text-align: left; padding: 34px 28px 30px; }
  .letter h3 { font-family: "Great Vibes", cursive; font-weight: 400; font-size: 36px; margin: 0 0 14px; color: #ffd1ea; text-align: center; }
  textarea {
    width: 100%; min-height: 190px; resize: vertical; padding: 18px; font-family: inherit; font-size: 18px; line-height: 1.7; color: #fff;
    background: rgba(255,255,255,.1); border: 1.5px solid rgba(255,255,255,.28); border-radius: 20px; outline: none; caret-color: var(--pink);
  }
  textarea::placeholder { color: rgba(255,255,255,.55); }
  textarea:focus { border-color: var(--pink); box-shadow: 0 0 0 4px rgba(255,79,163,.25), 0 0 30px rgba(255,79,163,.3); }
  .row { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; margin-top: 18px; }
  .note { margin: 14px 0 0; font-size: 13.5px; text-align: center; color: #f0d7ff; opacity: .85; }
  .linkbox { display: none; margin-top: 16px; padding: 12px 14px; border-radius: 14px; background: rgba(0,0,0,.28); font-size: 13px; word-break: break-all; text-align: left; color: #ffd1ea; }
  .read { font-size: 21px; line-height: 1.85; white-space: pre-wrap; min-height: 120px; text-align: center; }
  .read.rtl { direction: rtl; }
  .caret { display: inline-block; width: 2px; height: 1.1em; background: var(--pink); margin-left: 3px; vertical-align: -4px; animation: blink 1s steps(1) infinite; }
  @keyframes blink { 50% { opacity: 0; } }
  .signed { text-align: center; margin-top: 18px; font-family: "Great Vibes", cursive; font-size: 34px; color: #ffd1ea; opacity: 0; transition: opacity 1.2s; }
  .signed.on { opacity: 1; }

  .toast { position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom, 0px)); transform: translate(-50%, 30px); opacity: 0;
    background: rgba(26, 8, 51, .9); border: 1px solid var(--glass-edge); padding: 12px 22px; border-radius: 999px; z-index: 10; transition: .35s; font-weight: 600; }
  .toast.on { opacity: 1; transform: translate(-50%, 0); }

  /* page-open curtain */
  .flash { position: fixed; inset: 0; z-index: 5; pointer-events: none; opacity: 0;
    background: radial-gradient(circle at 50% 50%, rgba(255,255,255,.95), rgba(255,79,163,.6) 35%, transparent 70%); }
  .flash.go { animation: flash 1.1s ease-out; }
  @keyframes flash { 0% { opacity: 0; transform: scale(.4);} 25% { opacity: 1;} 100% { opacity: 0; transform: scale(2.2);} }

  .enter-main { animation: rise 1.1s cubic-bezier(.2,.9,.2,1) both; }
  @keyframes rise { from { opacity: 0; transform: translateY(40px) scale(.96); filter: blur(10px);} to { opacity: 1; transform: none; filter: none; } }

  @media (max-width: 700px) {
    .card { backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); }
    .btn { padding: 16px 28px; min-height: 52px; }
    .read { font-size: 19px; line-height: 1.8; }
    textarea { min-height: 170px; }
  }
  @media (max-width: 420px) { .pin input { width: 52px; height: 62px; font-size: 26px; } .pin { gap: 9px; } .card { padding: 34px 20px 28px; } }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; } }
</style>
</head>
<body>

<div class="bg" aria-hidden="true">
  <div class="orb o1"></div><div class="orb o2"></div><div class="orb o3"></div><div class="grain"></div>
</div>
<canvas id="hearts" aria-hidden="true"></canvas>
<div class="flash" id="flash"></div>

<div class="stage">

  <!-- ===== SECTION 1: password ===== -->
  <section class="card" id="gate" aria-labelledby="gt">
    <div class="lock-heart">💜</div>
    <h2 class="gate-title" id="gt">Our Special Day</h2>
    <p class="sub">Enter the secret code to open your surprise</p>
    <div class="pin" id="pin">
      <input inputmode="numeric" maxlength="1" pattern="[0-9]*" aria-label="digit 1" autocomplete="off">
      <input inputmode="numeric" maxlength="1" pattern="[0-9]*" aria-label="digit 2" autocomplete="off">
      <input inputmode="numeric" maxlength="1" pattern="[0-9]*" aria-label="digit 3" autocomplete="off">
      <input inputmode="numeric" maxlength="1" pattern="[0-9]*" aria-label="digit 4" autocomplete="off">
    </div>
    <p class="msg-err" id="err" role="alert"></p>
    <button class="btn" id="unlock" type="button">Unlock 💗</button>
  </section>

  <!-- ===== SECTION 2: the surprise ===== -->
  <main id="main">
    <header class="hero">
      <h1>Mannunty<span class="ph">💜</span></h1>
      <p>Happy Anniversary</p>
    </header>

    <section class="card letter" id="letterCard">
      <h3 id="letterTitle">A little note for you</h3>

      <!-- writer mode (for you) -->
      <div id="writer">
        <textarea id="text" placeholder="Write something from your heart here..."></textarea>
        <div class="row">
          <button class="btn ghost" id="preview" type="button">Preview 👀</button>
          <button class="btn" id="make" type="button">Send to her 💌</button>
        </div>
        <div class="linkbox" id="linkbox"></div>
        <p class="note">Write your message, press “Send to her”, then copy the link and send it. She will see the message here.</p>
      </div>

      <!-- reader mode (for her) -->
      <div id="reader" style="display:none">
        <div class="read" id="read"></div>
        <div class="signed" id="signed">Forever yours 💜</div>
        <div class="row"><button class="btn ghost" id="again" type="button">More hearts 💗</button></div>
      </div>
    </section>
  </main>
</div>

<div class="toast" id="toast"></div>

<script>
(function () {
  "use strict";

  /* ======= SETTINGS ======= */
  var PASSWORD = "1172";
  // Optional: paste your message here to bake it into the page itself (no link needed).
  var PRESET_MESSAGE = "";

  /* ======= helpers ======= */
  function $(id) { return document.getElementById(id); }
  function toast(t) { var el = $("toast"); el.textContent = t; el.classList.add("on"); setTimeout(function () { el.classList.remove("on"); }, 2200); }
  function enc(s) { return btoa(unescape(encodeURIComponent(s))); }
  function dec(s) { return decodeURIComponent(escape(atob(s))); }
  function getSharedMessage() {
    if (PRESET_MESSAGE) return PRESET_MESSAGE;
    var m = (location.hash || "").match(/[#&]m=([^&]+)/);
    if (!m) return "";
    try { return dec(decodeURIComponent(m[1])); } catch (e) { return ""; }
  }

  /* ======= flying hearts canvas ======= */
  var cv = $("hearts"), ctx = cv.getContext("2d"), W = 0, H = 0, DPR = Math.min(window.devicePixelRatio || 1, 2);
  var hearts = [], mode = "calm", MOBILE = Math.min(innerWidth, innerHeight) < 700, MAXH = MOBILE ? 35 : 70;
  var COLORS = ["#ff4fa3", "#ff7ac0", "#f0abfc", "#c084fc", "#a78bfa", "#ffd1ea", "#e879f9"];
  function resize() { W = innerWidth; H = innerHeight; cv.width = W * DPR; cv.height = H * DPR; ctx.setTransform(DPR, 0, 0, DPR, 0, 0); }
  addEventListener("resize", resize); resize();

  function spawn(x, y, burst) {
    var s = burst ? 10 + Math.random() * 22 : 8 + Math.random() * 26;
    hearts.push({
      x: x != null ? x : Math.random() * W,
      y: y != null ? y : H + 40,
      s: s,
      vx: burst ? (Math.random() - .5) * 7 : (Math.random() - .5) * .6,
      vy: burst ? -2 - Math.random() * 7 : -(.5 + Math.random() * 1.6) * (s > 22 ? .7 : 1),
      sw: Math.random() * Math.PI * 2, sws: .01 + Math.random() * .03,
      rot: (Math.random() - .5) * .6, vr: (Math.random() - .5) * .02,
      a: .35 + Math.random() * .6, c: COLORS[(Math.random() * COLORS.length) | 0],
      burst: !!burst
    });
  }
  function heartPath(c, s) {
    c.beginPath();
    c.moveTo(0, s * .35);
    c.bezierCurveTo(-s * .05, s * .1, -s * .6, -s * .05, -s * .6, -s * .4);
    c.bezierCurveTo(-s * .6, -s * .75, -s * .1, -s * .8, 0, -s * .45);
    c.bezierCurveTo(s * .1, -s * .8, s * .6, -s * .75, s * .6, -s * .4);
    c.bezierCurveTo(s * .6, -s * .05, s * .05, s * .1, 0, s * .35);
    c.closePath();
  }
  var sprites = {};
  function sprite(color) {
    if (sprites[color]) return sprites[color];
    var c = document.createElement("canvas"); c.width = c.height = 96;
    var x = c.getContext("2d");
    x.translate(48, 48); x.shadowColor = color; x.shadowBlur = 16; x.fillStyle = color;
    heartPath(x, 28); x.fill();
    return (sprites[color] = c);
  }
  var running = true;
  function loop() {
    if (document.hidden) { running = false; return; }
    requestAnimationFrame(loop);
    ctx.clearRect(0, 0, W, H);
    var rate = mode === "party" ? .5 : .1;
    if (Math.random() < rate && hearts.length < MAXH) spawn();
    for (var i = hearts.length - 1; i >= 0; i--) {
      var h = hearts[i];
      h.sw += h.sws; h.x += h.vx + Math.sin(h.sw) * .6; h.y += h.vy; h.rot += h.vr;
      if (h.burst) { h.vy += .08; h.vx *= .985; if (h.vy > -.4) { h.burst = false; h.vy = -(.6 + Math.random()); } }
      if (h.y < -60 || h.x < -60 || h.x > W + 60) { hearts.splice(i, 1); continue; }
      var k = h.s / 28, d = 96 * k;
      ctx.save(); ctx.translate(h.x, h.y); ctx.rotate(h.rot); ctx.globalAlpha = h.a;
      ctx.drawImage(sprite(h.c), -d / 2, -d / 2, d, d); ctx.restore();
    }
  }
  document.addEventListener("visibilitychange", function () {
    if (!document.hidden && !running) { running = true; requestAnimationFrame(loop); }
  });
  for (var k = 0; k < 18; k++) spawn(Math.random() * W, Math.random() * H);
  loop();

  function burst(x, y, n) { n = MOBILE ? Math.ceil(n * .6) : n; for (var i = 0; i < n; i++) spawn(x, y, true); }
  addEventListener("pointerdown", function (e) { if (e.target.closest("textarea,input")) return; burst(e.clientX, e.clientY, 10); });

  /* ======= tilt on card (desktop) ======= */
  var gate = $("gate");
  var tiltQueued = false, tx = 0, ty = 0;
  addEventListener("pointermove", function (e) {
    if (e.pointerType !== "mouse") return;
    tx = e.clientX; ty = e.clientY;
    if (tiltQueued) return; tiltQueued = true;
    requestAnimationFrame(function () {
      tiltQueued = false;
      var rx = (ty / H - .5) * -6, ry = (tx / W - .5) * 8;
      var card = gate.style.display === "none" ? $("letterCard") : gate;
      card.style.transform = "perspective(900px) rotateX(" + rx + "deg) rotateY(" + ry + "deg)";
    });
  });

  /* ======= password logic ======= */
  var inputs = Array.prototype.slice.call(document.querySelectorAll("#pin input"));
  var firstTry = true;
  inputs.forEach(function (inp, i) {
    inp.addEventListener("input", function () {
      inp.value = inp.value.replace(/\D/g, "").slice(0, 1);
      if (inp.value && i < inputs.length - 1) inputs[i + 1].focus();
      if (inputs.every(function (x) { return x.value; })) setTimeout(check, 180);
    });
    inp.addEventListener("keydown", function (e) {
      if (e.key === "Backspace" && !inp.value && i > 0) { inputs[i - 1].focus(); inputs[i - 1].value = ""; }
      if (e.key === "Enter") check();
    });
    inp.addEventListener("paste", function (e) {
      var t = (e.clipboardData || window.clipboardData).getData("text").replace(/\D/g, "").slice(0, 4);
      if (!t) return; e.preventDefault();
      t.split("").forEach(function (ch, j) { inputs[j].value = ch; });
      (inputs[Math.min(t.length, 3)]).focus();
      if (t.length === 4) setTimeout(check, 180);
    });
  });
  $("unlock").addEventListener("click", check);
  setTimeout(function () { inputs[0].focus(); }, 400);

  function wrong(text) {
    var err = $("err"); err.textContent = text;
    var pin = $("pin"); pin.classList.remove("shake"); void pin.offsetWidth; pin.classList.add("shake");
    inputs.forEach(function (x) { x.value = ""; }); inputs[0].focus();
    burst(W / 2, H / 2, 6);
  }
  function check() {
    var v = inputs.map(function (x) { return x.value; }).join("");
    if (v.length < 4) { $("err").textContent = "Enter all 4 digits"; return; }
    if (firstTry) { firstTry = false; wrong("Try again Nono <3"); return; }   // first attempt always bounces
    if (v === PASSWORD) { openSite(); } else { wrong("Try again Nono <3"); }
  }

  /* ======= open site ======= */
  function openSite() {
    $("flash").classList.add("go");
    mode = "party"; burst(W / 2, H / 2, 70);
    var i = 0, iv = setInterval(function () { burst(Math.random() * W, H * (.3 + Math.random() * .6), 14); if (++i > 8) clearInterval(iv); }, 160);
    gate.style.transition = "opacity .5s, transform .6s"; gate.style.opacity = "0"; gate.style.transform = "scale(.85) translateY(-20px)";
    setTimeout(function () {
      gate.style.display = "none";
      var main = $("main"); main.style.display = "block"; main.classList.add("enter-main");
      setupSection2();
      setTimeout(function () { mode = "calm"; }, 6000);
    }, 650);
  }

  /* ======= section 2 ======= */
  function typeInto(el, text, done) {
    el.textContent = ""; var i = 0, caret = document.createElement("span"); caret.className = "caret";
    var node = document.createTextNode(""); el.appendChild(node); el.appendChild(caret);
    (function step() {
      if (i >= text.length) { caret.remove(); done && done(); return; }
      node.nodeValue += text.charAt(i++);
      if (i % 25 === 0) spawn(Math.random() * W, H + 20);
      setTimeout(step, text.charAt(i - 1) === "\n" ? 260 : 38);
    })();
  }
  function showReader(text) {
    $("writer").style.display = "none"; $("reader").style.display = "block";
    $("letterTitle").textContent = "For you, my love";
    var r = $("read"); if (/[\u0600-\u06FF]/.test(text)) r.classList.add("rtl");
    $("signed").classList.remove("on");
    typeInto(r, text, function () { $("signed").classList.add("on"); mode = "party"; burst(W / 2, H * .6, 50); setTimeout(function () { mode = "calm"; }, 4000); });
  }
  function setupSection2() {
    var shared = getSharedMessage();
    if (shared) { showReader(shared); return; }
    try { var d = localStorage.getItem("anniv_draft"); if (d) $("text").value = d; } catch (e) {}
    $("text").addEventListener("input", function () { try { localStorage.setItem("anniv_draft", $("text").value); } catch (e) {} });
  }
  $("preview").addEventListener("click", function () {
    var t = $("text").value.trim(); if (!t) { toast("Write something first 💜"); return; }
    showReader(t);
    $("again").textContent = "Back to editing ✏️"; $("again").dataset.back = "1";
  });
  $("again").addEventListener("click", function (e) {
    if (e.currentTarget.dataset.back) {
      e.currentTarget.dataset.back = ""; e.currentTarget.textContent = "More hearts 💗";
      $("reader").style.display = "none"; $("writer").style.display = "block"; $("letterTitle").textContent = "A little note for you"; return;
    }
    burst(W / 2, H / 2, 60);
  });
  $("make").addEventListener("click", function () {
    var t = $("text").value.trim(); if (!t) { toast("Write something first 💜"); return; }
    var link = location.href.split("#")[0] + "#m=" + encodeURIComponent(enc(t));
    var box = $("linkbox"); box.style.display = "block"; box.textContent = link;
    burst(W / 2, H * .6, 40);
    function copyIt() {
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(link).then(function () { toast("Link copied 💌 Send it to her!"); }, function () { toast("Copy the link below 💌"); });
      } else { toast("Copy the link below 💌"); }
    }
    if (navigator.share) {
      navigator.share({ title: "Mannunty 💜", text: "A surprise for you 💜", url: link }).catch(copyIt);
    } else { copyIt(); }
  });
})();
</script>
</body>
</html>
